<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONRAMP · Client Onboarding Workbench · on neuro-san</title>
<style>
:root{
  /* Light palette (default) — from color_pallatte.txt */
  --bg:#F4F7FB;--bg2:#FFFFFF;--panel:#FFFFFF;--panel2:#F8FAFC;--line:#E2E8F0;
  --text:#172033;--muted:#64748B;--dim:#94A3B8;
  --a1:#4F46E5;   /* primary actions (indigo) */
  --a2:#0F9D8A;   /* workflow accent (teal) */
  --a3:#8B5CF6;   /* agent / AI accent (purple) */
  --ok:#16A34A;   /* pass */
  --warn:#D97706; /* review */
  --bad:#DC2626;  /* block */
  --info:#2563EB;
  /* Dark navy sidebar (constant across themes) */
  --side-bg:#111827;--side-text:#E5E9F2;--side-muted:#9AA6BD;--side-line:#1E2638;--side-hover:#1B2436;
  --grad:linear-gradient(135deg,#4F46E5 0%,#8B5CF6 55%,#0F9D8A 100%);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);--r:14px;
}
/* Dark theme (opt-in via body.dark) */
body.dark{
  --bg:#0b1220;--bg2:#111a2b;--panel:#111a2b;--panel2:#16213a;--line:#273349;
  --text:#e6ecf8;--muted:#9fb0cc;--dim:#6b7c9b;
  --a1:#6366F1;--a2:#2dd4bf;--a3:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
  --side-bg:#0a0f1a;--side-text:#e5e9f2;--side-muted:#8b99b5;--side-line:#1a2335;--side-hover:#141d2e;
  --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
a{color:var(--a1)}
#app{display:flex;height:100vh}
/* Sidebar — always dark navy */
#side{width:248px;min-width:248px;background:var(--side-bg);display:flex;flex-direction:column;height:100vh;color:var(--side-text)}
.brand{padding:20px 20px 16px}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--a1);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.brand h1{font-size:18px;letter-spacing:1.5px;color:#fff;font-weight:800}
.brand small{display:block;color:var(--side-muted);font-size:11px}
#nav{overflow-y:auto;flex:1;padding:6px 12px 20px}
.navgrp{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--side-muted);opacity:.7;margin:16px 10px 6px}
.navi{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--side-muted);font-size:13.5px;transition:.15s;margin-bottom:2px}
.navi:hover{background:var(--side-hover);color:#fff}
.navi.on{background:#fff;color:var(--a1);font-weight:600;box-shadow:inset 3px 0 0 var(--a1)}
.navi .n{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:10.5px;color:var(--side-muted);flex-shrink:0}
.navi:hover .n{color:#fff}
.navi.on .n{background:var(--a1);color:#fff}
.sidefoot{padding:14px 18px;border-top:1px solid var(--side-line);font-size:11px;color:var(--side-muted);opacity:.8}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--bg2)}
#top .crumb{font-size:13px;color:var(--muted)}
#top .crumb b{color:var(--text)}
#top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);background:rgba(22,163,74,.1)}
.pill.warn{color:var(--warn);background:rgba(217,119,6,.12)}
.pill.bad{color:var(--bad);background:rgba(220,38,38,.1)}
.pill.info{color:var(--info);background:rgba(37,99,235,.1)}
.pill.vio{color:var(--a3);background:rgba(139,92,246,.12)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--a1);color:var(--a1)}
.btn.pri{background:var(--a1);border:1px solid var(--a1);color:#fff}
.btn.pri:hover{background:#4338CA;border-color:#4338CA;color:#fff}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
#view{flex:1;overflow-y:auto;padding:24px 28px 60px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{font-size:24px;letter-spacing:-.2px;font-weight:800}
.ph p{color:var(--muted);max-width:880px;margin-top:4px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--a2);font-weight:700}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1100px){.g3,.g4,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-weight:700}
.card h4{font-size:12.5px;margin:12px 0 6px;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--muted)}
.grad-text{color:var(--a1)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
td .mono,td.mono{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.wrap{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);margin:1px 2px 1px 0}
.bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--a2);border-radius:6px;transition:width .6s}
/* Lifecycle stepper (numbered circles, teal for done/active) */
.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 2px}
.step{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.step .circ{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel);border:2px solid var(--line);color:var(--muted);z-index:1}
.step.done .circ{background:var(--a2);border-color:var(--a2);color:#fff}
.step.active .circ{background:var(--a1);border-color:var(--a1);color:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.step .slbl{font-size:11px;font-weight:600;color:var(--text);margin-top:7px;max-width:100px;line-height:1.3}
.step .ssub{font-size:10px;color:var(--muted);margin-top:1px}
.step.pending .slbl{color:var(--muted)}
.step:not(:last-child)::after{content:"";position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step.done:not(:last-child)::after{background:var(--a2)}
.muted{color:var(--muted)}.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}.vio{color:var(--a3)}.teal{color:var(--a2)}
.mono,pre,code{font-family:Consolas,"Cascadia Code","SF Mono",Menlo,monospace}
pre{background:#0f172a;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-size:12px;line-height:1.55;color:#cbd5e1;max-height:520px;white-space:pre-wrap;word-break:break-word}
input,select,textarea{font-family:inherit;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
label.f{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sep{height:1px;background:var(--line);margin:14px 0}
.note{border-left:3px solid var(--a2);background:rgba(15,157,138,.07);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--muted);font-size:12.8px;margin:12px 0}
.note.w{border-color:var(--warn);background:rgba(217,119,6,.08)}
.note.b{border-color:var(--bad);background:rgba(220,38,38,.07)}
.lc{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:6px}
.lc.done{border-color:rgba(15,157,138,.4);background:rgba(15,157,138,.05)}
.lc.act{border-color:var(--a1);box-shadow:0 0 0 2px rgba(79,70,229,.15)}
.lc.hold{border-color:rgba(217,119,6,.5);background:rgba(217,119,6,.05)}
.av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;background:var(--a1)}
.slyrow{display:flex;justify-content:space-between;padding:6px 8px;border-radius:7px;font-family:Consolas,monospace;font-size:12px;margin-bottom:4px;background:var(--panel2)}
.node{cursor:pointer}.edge{stroke:var(--line);stroke-width:1.6;fill:none}
.toast{position:fixed;bottom:22px;right:22px;background:var(--text);border:1px solid var(--text);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.25);z-index:99;font-size:13px;display:none;color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--a1);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- Landing / hero (dark showcase band, used in both themes) ---- */
.hero{background:radial-gradient(1100px 500px at 15% -10%,rgba(99,102,241,.22),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(15,157,138,.14),transparent 55%),#0b1020;border:1px solid #1e2740;border-radius:20px;padding:40px 44px;color:#e8edf8;box-shadow:0 20px 60px rgba(8,12,24,.35)}
.hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
@media(max-width:1000px){.hero-grid{grid-template-columns:1fr;gap:28px}}
.hero .eyebrow-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #2a3450;color:#45d6b4;background:rgba(15,157,138,.08);padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase}
.hero h1{font-size:52px;line-height:1.05;letter-spacing:-1.5px;font-weight:800;margin:22px 0 18px;color:#f3f6fc}
.hero h1 .accent{color:#8a8ff5}
.hero .lead{color:#aeb9d4;font-size:15px;line-height:1.7;max-width:560px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero .btn-grad{background:linear-gradient(135deg,#6366F1,#8B5CF6 55%,#0F9D8A);border:none;color:#fff;font-weight:700;padding:12px 20px;border-radius:11px;cursor:pointer;font-size:13.5px;font-family:inherit}
.hero .btn-ghost{background:transparent;border:1px solid #39436200;border:1px solid #333e5c;color:#e8edf8;font-weight:600;padding:12px 18px;border-radius:11px;cursor:pointer;font-size:13.5px;font-family:inherit}
.hero .btn-ghost:hover{border-color:#8a8ff5}
.hero .feat{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px;font-size:12.5px;color:#aeb9d4}
.hero .feat b{color:#45d6b4;margin-right:6px}
.hero-card{background:#0e1527;border:1px solid #232d49;border-radius:16px;padding:22px}
.hero-card .hc-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#e8edf8}
.hero-card .online{color:#34d399;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.hero-card h3{color:#f3f6fc;font-size:18px;margin:16px 0 2px;font-weight:800}
.hero-card .hc-sub{color:#8f9bb8;font-size:12px}
.hc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.hc-stat{background:#121a30;border:1px solid #232d49;border-radius:12px;padding:12px}
.hc-stat .v{font-size:26px;font-weight:800;color:#8a8ff5;line-height:1}
.hc-stat .l{font-size:11px;color:#8f9bb8;margin-top:6px}
.hc-label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#6f7c9c;font-weight:700;margin:4px 0 8px}
.hc-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hc-seg{border-top:3px solid var(--seg,#5b8cff);background:#121a30;border-radius:0 0 8px 8px;padding:8px 10px}
.hc-seg .n{font-size:10.5px;color:#6f7c9c;font-weight:700}
.hc-seg .t{font-size:11px;color:#cdd6ea;margin-top:3px;line-height:1.3}
.hero-card .hc-foot{margin-top:16px;font-size:11px;color:#6f7c9c}
</style>
</head>
<body>
<div id="app">
<aside id="side">
  <div class="brand"><div class="logo"><div class="mark">OR</div><div><h1>ONRAMP</h1><small>Client onboarding workbench · on neuro-san</small></div></div></div>
  <nav id="nav"></nav>
  <div class="sidefoot">Local build · fictional clients · neuro-san is Apache-2.0, by Cognizant AI Lab</div>
</aside>
<main id="main">
  <div id="top">
    <div class="crumb" id="crumb"></div><div class="sp"></div>
    <span class="pill info" id="nsPill"><span class="dot"></span>neuro-san: checking…</span>
    <span class="pill" id="provPill">provider: —</span>
    <button class="btn sm" id="themeBtn" onclick="toggleTheme()" title="Toggle dark/light">☀ Light</button>
  </div>
  <div id="view"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
async function api(path,opts){const r=await fetch('/api'+path,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));let b=null;try{b=await r.json()}catch(e){}if(!r.ok){const msg=(b&&(b.detail&&b.detail.message||b.detail||b.error))||r.statusText;const e=new Error(typeof msg==='string'?msg:JSON.stringify(msg));e.body=b;e.status=r.status;throw e}return b}

const AGENTS=[
 {id:'onboarding_concierge',ab:'OC',c:'#5b8cff',role:'Front-man',name:'Onboarding Concierge',tools:['Deal Handover Agent','Document Intelligence Agent','Compliance Agent','Legal MSA Validator','Commercial Setup Agent','Delivery Mobilisation Agent','Access Provisioning Agent','Client Communications Agent']},
 {id:'deal_handover_agent',ab:'DH',c:'#43c3ff',role:'Specialist',name:'Deal Handover Agent',tools:[]},
 {id:'document_intelligence_agent',ab:'DI',c:'#21d4b4',role:'Specialist',name:'Document Intelligence Agent',tools:['Checklist Tracker (coded tool)']},
 {id:'compliance_agent',ab:'CO',c:'#ffb547',role:'Specialist',name:'Compliance Agent',tools:['Compliance Screen (coded tool)']},
 {id:'legal_msa_validator',ab:'LG',c:'#b36bff',role:'Specialist',name:'Legal MSA Validator',tools:['Clause Playbook (coded tool)']},
 {id:'commercial_setup_agent',ab:'CB',c:'#ff7ab6',role:'Specialist',name:'Commercial Setup Agent',tools:['PO Reconciler (coded tool)']},
 {id:'delivery_mobilisation_agent',ab:'DM',c:'#2fd27a',role:'Specialist',name:'Delivery Mobilisation Agent',tools:[]},
 {id:'access_provisioning_agent',ab:'AP',c:'#7aa2ff',role:'Specialist',name:'Access Provisioning Agent',tools:[]},
 {id:'client_comms_agent',ab:'CC',c:'#43e0d0',role:'Specialist',name:'Client Communications Agent',tools:[]}];
const STAGES=['Deal handover','Document collection','Compliance & KYB','MSA/SOW validation','Commercial & billing','Mobilisation & access','Client kickoff','Hypercare to first value'];
let STATE={cases:[],caseId:null};

const PAGES=[
 {id:'home',grp:'Home',title:'Home',render:renderHome},
 {id:'portfolio',grp:'Operate',title:'Portfolio',render:renderPortfolio},
 {id:'case',grp:'Operate',title:'Case workspace',render:renderCase},
 {id:'review',grp:'Operate',title:'Concierge review',render:renderReview},
 {id:'lifecycle',grp:'Operate',title:'Lifecycle board',render:renderLifecycle},
 {id:'humanreview',grp:'Operate',title:'Human review',render:renderHuman},
 {id:'audit',grp:'Operate',title:'Audit history',render:renderAudit},
 {id:'network',grp:'Network',title:'Agent network',render:renderNetwork},
 {id:'liveflow',grp:'Network',title:'Live agent flow (nsflow)',render:renderLiveFlow},
 {id:'architecture',grp:'Network',title:'ONRAMP Architecture',render:renderArchitecture},
 {id:'settings',grp:'Configure',title:'Settings · API keys',render:renderSettings},
 {id:'help',grp:'Help',title:'Help & guide',render:renderHelp}];

function buildNav(){let h='',g='';PAGES.forEach((p,i)=>{if(p.grp!==g){g=p.grp;h+=`<div class="navgrp">${g}</div>`}h+=`<div class="navi" data-id="${p.id}" onclick="go('${p.id}')"><span class="n">${i+1}</span>${p.title}</div>`});$('#nav').innerHTML=h}
let CUR=null;
async function go(id){const p=PAGES.find(x=>x.id===id)||PAGES[0];CUR=p.id;$$('.navi').forEach(n=>n.classList.toggle('on',n.dataset.id===p.id));$('#crumb').innerHTML=`${p.grp} › <b>${p.title}</b>`;const v=$('#view');v.innerHTML='<div class="card"><span class="spin"></span> Loading…</div>';try{await p.render(v)}catch(e){v.innerHTML=`<div class="card"><h3 class="bad">Could not load this page</h3><pre>${esc(e.message||e)}</pre></div>`}v.scrollTop=0;try{history.replaceState(null,'','#'+id)}catch(e){}}

function ph(eb,t,p,right){return `<div class="ph"><div><div class="eyebrow">${eb}</div><h2>${t}</h2>${p?`<p>${esc(p)}</p>`:''}</div>${right||''}</div>`}
function kpi(v,l,cls){return `<div class="card kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div></div>`}
function resultPill(r){return r==='PASS'?'<span class="pill ok">PASS</span>':r==='REVIEW'?'<span class="pill warn">REVIEW</span>':'<span class="pill bad">BLOCK</span>'}
function statusPill(s){const m={gate_clear:['ok','Checks clear'],approvable:['ok','Approvable']};return ''}

/* ---------- Home (landing hero) ---------- */
async function renderHome(v){
 let caseCount=0,nsOnline=false,provider='',keyConfigured=false;
 try{const cases=await api('/cases');caseCount=cases.length}catch(e){}
 try{const h=await api('/health');nsOnline=!!(h.neuro_san&&h.neuro_san.reachable);provider=h.provider||'';keyConfigured=!!h.provider_key_configured}catch(e){}
 const segs=[['01 — 02','Handoff &amp; documents','#5b8cff'],['03 — 04','Compliance &amp; legal','#5b8cff'],['05 — 06','Commercial &amp; mobilisation','#D97706'],['07 — 08','Kickoff &amp; first value','#8B5CF6']];
 v.innerHTML=`<div class="hero"><div class="hero-grid">
   <div>
     <span class="eyebrow-pill"><span class="dot"></span>Post-sale client onboarding · Hackathon demo</span>
     <h1>Turn a closed-won deal into a <span class="accent">governed client launch.</span></h1>
     <p class="lead">ONRAMP is a client-onboarding workbench for the gap after a deal closes. It turns the sales handoff and required records into one case, runs deterministic Python checks, and uses a Neuro-SAN Concierge to coordinate eight specialist agents. People review exceptions and approve kickoff.</p>
     <div class="cta">
       <button class="btn-grad" onclick="go('portfolio')">See the onboarding cases →</button>
       <button class="btn-ghost" onclick="go('portfolio');setTimeout(newCaseModal,60)">+ Create a new case</button>
     </div>
     <div class="feat"><span><b>01</b>One traceable case</span><span><b>02</b>AI coordination with human approval</span><span><b>03</b>Clear kickoff gates</span></div>
   </div>
   <div class="hero-card">
     <div class="hc-head"><span>Your onboarding workspace</span><span class="online"><span class="dot" style="background:${nsOnline?'#34d399':'#f87171'}"></span>${nsOnline?'Neuro-SAN online':'Neuro-SAN offline'}</span></div>
     <h3>From handoff to first value</h3>
     <div class="hc-sub">One governed path for every client launch</div>
     <div class="hc-stats">

 ${rows.map(r=>`<tr><td class="mono" style="font-size:11px">${esc((r.created_at||'').replace('T',' '))}</td><td class="muted">${esc(r.actor)}</td><td>${mode==='user'?esc(humanizeAction(r.action)):`<span class="tag">${esc(r.action)}</span>`}</td><td class="${mode==='dev'?'muted mono':'muted'}" style="font-size:${mode==='dev'?'11':'12.5'}px">${mode==='user'?esc(humanizeAudit(r)):esc(JSON.stringify(r.detail||{}))}</td></tr>`).join('')}
 </tbody></table></div>`}
function setAuditMode(m){STATE.auditMode=m;go('audit')}
function humanizeAction(a){const m={case_created:'Case created',case_seeded:'Case loaded',evidence_added:'Document added',evidence_deleted:'Document deleted',file_removed:'File removed',downstream_invalidated:'Checks reset',checks_run:'Checks run',check_dispositioned:'Reviewer decision',agent_run:'AI review',signoff_recorded:'Sign-off recorded',stage_advanced:'Stage advanced',status_changed:'Status changed'};return m[a]||a.replace(/_/g,' ')}
function humanizeAudit(r){const d=r.detail||{};const a=r.action;
 switch(a){
  case 'case_created': return `A new onboarding case was created for ${d.client_name||'the client'}.`;
  case 'case_seeded': return `${d.client_name||'A sample client'} was loaded as a starter case.`;
  case 'evidence_added': return `A ${docName(d.kind)} was added${d.sha256?' (file attached)':''}.`;
  case 'evidence_deleted': return `The ${docName(d.kind)} record was deleted.`;
  case 'file_removed': return `The attached file was removed from the ${docName(d.kind)} (the record was kept).`;
  case 'downstream_invalidated': return `Because the evidence changed, previous checks, AI reviews and sign-offs were reset and must be re-run.`;
  case 'checks_run': return `Automated eligibility checks were run (${d.count!=null?d.count+' checks':'all checks'}).`;
  case 'check_dispositioned': return `A reviewer marked "${d.check||'a check'}" as ${d.disposition||'reviewed'}${d.rationale?' — '+d.rationale:''}.`;
  case 'agent_run': return `The AI Concierge review ${d.status==='success'?'completed successfully':'failed and was recorded'}${d.model?' using '+d.model:''}.`;
  case 'signoff_recorded': return `A named sign-off was recorded for the "${d.gate||'gate'}" step${d.note?' — '+d.note:''}.`;
  case 'stage_advanced': return `The onboarding moved to stage ${d.stage!=null?d.stage:'the next stage'}.`;
  case 'status_changed': return `The case status changed to "${d.status||'updated'}".`;
  default: return a.replace(/_/g,' ')+(Object.keys(d).length?': '+JSON.stringify(d):'');
 }}
function docName(kind){const m={msa:'Executed Master Services Agreement (MSA)',sow:'Statement of Work (SOW)',order_form:'Order Form',po:'Purchase Order (PO)',dpa:'Data Processing Agreement (DPA)'};return m[kind]||kind||'document'}

 const wrapName=(nm)=>{const w=nm.replace(' Agent','').split(' ');const mid=Math.ceil(w.length/2);return [w.slice(0,mid).join(' '),w.slice(mid).join(' ')]};
 const nodes=pos.map(p=>{const ln=wrapName(p.a.name);return `<g class="node"><title>${esc(p.a.name)}</title><rect x="${p.x-54}" y="${p.y-26}" width="108" height="52" rx="11" style="fill:var(--panel2)" stroke="${p.a.c}" stroke-width="2"/><text x="${p.x}" y="${p.y-2}" text-anchor="middle" font-size="9" font-weight="700" fill="${p.a.c}">${esc(ln[0])}</text><text x="${p.x}" y="${p.y+11}" text-anchor="middle" font-size="9" font-weight="700" fill="${p.a.c}">${esc(ln[1])}</text></g>`}).join('');
 const agentList=AGENTS.map(a=>`<div class="lc"><div class="av" style="background:${a.c}">${a.ab}</div><div style="flex:1;min-width:0"><b>${esc(a.name)}</b> <span class="pill vio" style="font-size:10px">${esc(a.role)}</span>${a.tools&&a.tools.length?`<div class="dim" style="font-size:11px">Calls: ${a.tools.map(esc).join(', ')}</div>`:''}</div></div>`).join('');
 v.innerHTML=ph('neuro-san network: onramp_onboarding','Agent network','The real served network: an Onboarding Concierge front-man delegating to eight specialist agents via AAOSA. Four deterministic Python coded tools (services) do the exact work.')

 <div class="note">Deterministic coded-tool services: Checklist Tracker, Compliance Screen, Clause Playbook, and PO Reconciler — each reads private values from the sly_data channel and returns only non-sensitive results.</div></div>

 try{const c=await api('/settings/credits');

   box.innerHTML=`<div class="kpi"><div class="v grad-text">${rem}</div><div class="l">remaining credit</div></div><div class="row" style="margin-top:8px;gap:16px"><span class="muted">used <b>${used}</b></span><span class="muted">limit <b>${lim}</b></span>${c.is_free_tier?'<span class="pill info">free tier</span>':''}</div>`}
  else{box.innerHTML=`<div class="muted">${esc(c.reason||'Not available.')}</div>`}
 }catch(e){box.innerHTML=`<div class="muted">Could not load balance: ${esc(e.message||e)}</div>`}}

/* ---------- Header status ---------- */
async function refreshHeader(){try{const h=await api('/health');$('#provPill').textContent='provider: '+h.provider+(h.provider_key_configured?' ✓':' (no key)');$('#provPill').className='pill '+(h.provider_key_configured?'ok':'warn');const ns=h.neuro_san||{};$('#nsPill').innerHTML='<span class="dot"></span>neuro-san: '+(ns.reachable?'connected':'offline');$('#nsPill').className='pill '+(ns.reachable?'ok':'bad')}catch(e){}}

/* ---------- Help & guide ---------- */

function faq(q,a){return `<div class="lc" style="flex-direction:column;align-items:stretch;cursor:pointer" onclick="this.querySelector('.faq-a').style.display=this.querySelector('.faq-a').style.display==='none'?'block':'none'"><b>${q}</b><div class="faq-a muted" style="font-size:12.5px;margin-top:6px;display:none">${a}</div></div>`}

 +`<div class="grid g3" style="margin-bottom:14px">

 <div class="grid g2">
  <div class="card"><h3>What is ONRAMP?</h3>

   <div style="margin-top:10px">

    <div class="lc"><div class="av" style="background:var(--a2)">✓</div><div><b>Deterministic checks</b><div class="muted" style="font-size:12px">Rule-based checks (no AI) that pass, flag for review, or block — so decisions are consistent and explainable.</div></div></div>
    <div class="lc"><div class="av" style="background:var(--a1)">👤</div><div><b>Named human approvals</b><div class="muted" style="font-size:12px">People sign off the key gates. The AI assists; humans decide. Every action is written to an audit trail.</div></div></div>
   </div>
  </div>
  <div class="card"><h3>Jump to a section</h3>
   <div class="row" style="gap:8px">

 </div>

  ${helpStep(3,'Run the automated checks','Click <b>Run evidence checks</b>. ONRAMP runs rule-based checks that mark each item <span class="pill ok">PASS</span>, <span class="pill warn">REVIEW</span>, or <span class="pill bad">BLOCK</span>. Missing documents block; ambiguous items need a human review.','case','Open Case workspace')}

/* ---------- Theme (light default / dark toggle) ---------- */
function applyTheme(t){document.body.classList.toggle('dark',t==='dark');const b=$('#themeBtn');if(b)b.textContent=t==='dark'?'☀ Light':'☾ Dark'}
function initTheme(){let t='light';try{t=localStorage.getItem('onramp_theme')||'light'}catch(e){}applyTheme(t)}
function toggleTheme(){let t='light';try{t=localStorage.getItem('onramp_theme')||'light'}catch(e){}t=t==='dark'?'light':'dark';try{localStorage.setItem('onramp_theme',t)}catch(e){}applyTheme(t)}

initTheme();buildNav();refreshHeader();setInterval(refreshHeader,15000);go((location.hash||'').slice(1)||'home');
</script>
