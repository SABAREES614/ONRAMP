[project]
name = "onramp-neuro-san"
version = "0.2.0"
description = "Local first, human governed client onboarding workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-ollama>=0.3,<2",
  "neuro-san-studio==0.4.2",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
onramp = "onramp_neuro_san:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
